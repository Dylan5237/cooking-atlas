services:
  postgres:
    image: postgres:16-alpine
    container_name: cooking-atlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cooking_atlas
      POSTGRES_USER: cooking
      POSTGRES_PASSWORD: cooking_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U cooking -d cooking_atlas"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: cooking-atlas-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: cooking
      MINIO_ROOT_PASSWORD: cooking_dev_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
volumes:
  postgres_data:
  minio_data:
