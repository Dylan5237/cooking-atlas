# cooking-atlas H5 共用 location 片段：静态 SPA + 同源 /api 反代 + 健康检查。
# 被两个 server 块 include（80 端口 nip.io 试用入口 / 127.0.0.1:8090 tailscale 入口），
# 安装位置：/etc/nginx/cooking-atlas/h5-locations.conf
# 修改后必须 nginx -t 通过才允许 reload。
root /var/www/cooking-atlas-h5;
index index.html;
client_max_body_size 12m;

location = /health {
    proxy_pass http://127.0.0.1:3001;
    access_log off;
}

# 试用码入口：仓库公开过旧码，除服务端 deviceId 限流外再加 nginx 每 IP 限流
location = /api/auth/trial {
    limit_req zone=cooking_atlas_trial burst=10 nodelay;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;   # AI 草稿/语音转写可能较慢
    proxy_send_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# hash 路由：任意路径回落 index.html，刷新可达；静态资源先按文件精确命中
location / {
    try_files $uri $uri/ /index.html;
}
