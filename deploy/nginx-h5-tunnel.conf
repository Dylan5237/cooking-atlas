# cooking-atlas H5 tailscale 入口：仅供本机 tailscale serve 反代（tailscale serve --https=8443 → 127.0.0.1:8090）。
# 不监听公网、不影响现有站点；静态与 /api 逻辑见 nginx-h5-locations.conf。
# 安装位置：/etc/nginx/sites-available/cooking-atlas-h5（软链到 sites-enabled）
server {
    listen 127.0.0.1:8090;
    server_name cooking-atlas-h5;

    access_log /var/log/nginx/cooking-atlas-h5.access.log;
    error_log  /var/log/nginx/cooking-atlas-h5.error.log;

    include /etc/nginx/cooking-atlas/h5-locations.conf;
}
