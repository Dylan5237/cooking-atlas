# cooking-atlas 试用期 HTTP 反代（无域名 / 无证书方案）
#
# 用途：让手机在「开发者工具 / 预览 / 真机调试 + 打开调试模式」下直连 CVM，无需备案域名与证书。
# 限制：体验版与正式版仍强制校验合法域名，本文件不解决那条路径。
#
# 关键设计：**不改动现有站点**。
#   现有 nginx 站点（brainstormtool）用 `listen 80; server_name _;` 作为 80 端口默认服务器，
#   并用 `listen 10.1.0.3:443 ssl http2; server_name 43.139.159.100;` 占住 443。
#   这里只在 80 端口追加一个按 **主机名** 精确匹配的 server 块：
#     - 访问 http://43.139.159.100/        → Host 不匹配 → 仍走默认服务器（现有站点，不受影响）
#     - 访问 https://43.139.159.100/       → 443 完全未改动
#     - 访问 http://43.139.159.100.nip.io → 命中本块 → 反代 API
#   nip.io / sslip.io 是公共通配 DNS，会把 <IP>.<域> 解析回该 IP，无需自己持有域名。
#
# 安全提示：本方案是明文 HTTP，JWT 与照片会在公网传输。仅用于自用试用，勿放真实家庭敏感数据。
# 停用：删除 /etc/nginx/sites-enabled/cooking-atlas-trial 后 nginx -t && reload。

server {
    listen 80;
    server_name 43.139.159.100.nip.io 43-139-159-100.sslip.io;

    # 需 > API 的 MAX_UPLOAD_MB（默认 10MB）
    client_max_body_size 12m;

    access_log /var/log/nginx/cooking-atlas-trial.access.log;
    error_log  /var/log/nginx/cooking-atlas-trial.error.log;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health {
        proxy_pass http://127.0.0.1:3001;
        access_log off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_read_timeout 120s;   # AI 草稿/语音转写可能较慢
        proxy_send_timeout 120s;
    }

    location / {
        return 404;
    }
}
