# cooking-atlas nginx 虚拟主机（A7 待启用）
#
# 前提（微信小程序硬性要求，已查官方原文）：
#   1. request 合法域名必须是已 ICP 备案域名 + HTTPS + TLS≥1.2，不能用 IP 或 localhost
#   2. CVM 公网 80/443 已由现有 nginx 站点（brainstormtool，监听 10.1.0.3）占用
#      —— 因此只能以 server_name 虚拟主机方式新增，禁止改动现有站点配置文件
#   3. api 容器仅绑定 127.0.0.1:3001（回环），由本 vhost 反代
#
# 启用步骤见 docs/A7_DEPLOY_RUNBOOK.md，务必先 nginx -t 再 reload。

upstream cooking_atlas_api {
    server 127.0.0.1:3001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # certbot --webroot 续期校验用
    location /.well-known/acme-challenge/ {
        root /var/www/_letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL_cooking:10m;
    ssl_session_timeout 1d;

    # 上传上限需 > API 的 MAX_UPLOAD_MB（默认 10MB），留出 multipart 开销
    client_max_body_size 12m;
    client_body_timeout 60s;

    access_log /var/log/nginx/cooking-atlas.access.log;
    error_log  /var/log/nginx/cooking-atlas.error.log;

    # 签名 URL 读取对象存储：不缓存、不透出内部头部
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    location = /health {
        proxy_pass http://cooking_atlas_api;
        access_log off;
    }

    location /api/ {
        proxy_pass http://cooking_atlas_api;
        proxy_read_timeout 120s;   # AI 草稿/转写可能较慢
        proxy_send_timeout 120s;
    }

    location / {
        return 404;
    }
}
